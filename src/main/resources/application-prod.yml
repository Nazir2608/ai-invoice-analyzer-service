spring:
  application:
    name: ai-invoice-analyzer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/invoice_analyzer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:MySql@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:invoice-group}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}

logging:
  level:
    root: INFO
    com.nazir.aiinvoice: INFO

app:
  kafka-enabled: true

ai:
  provider: ${AI_PROVIDER:ollama}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-3.5-turbo}
    url: ${AI_OPENAI_URL:https://api.openai.com/v1/chat/completions}
    temperature: ${AI_OPENAI_TEMPERATURE:0.1}
  ollama:
    url: ${AI_OLLAMA_URL:http://ollama:11434}
    model: ${AI_OLLAMA_MODEL:gemma3:4b}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
  retry:
    instances:
      aiService:
        maxAttempts: 3
        waitDuration: 2s
  timelimiter:
    instances:
      aiService:
        timeoutDuration: 20s
