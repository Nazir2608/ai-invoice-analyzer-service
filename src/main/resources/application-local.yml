spring:
  application:
    name: ai-invoice-analyzer-service

  datasource:
    url: jdbc:mysql://localhost:3306/invoice_analyzer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: MySql@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: invoice-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8080
  ssl:
    enabled: false

logging:
  level:
    root: INFO
    com.nazir.aiinvoice: DEBUG
app:
  kafka-enabled: false
ai:
  provider: local # Options: local, openai, ollama
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-3.5-turbo
  ollama:
    url: http://localhost:11434
    model: gemma3:4b 

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
