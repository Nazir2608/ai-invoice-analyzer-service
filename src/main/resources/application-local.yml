spring:
  application:
    name: ai-invoice-analyzer-service

  datasource:
    url: jdbc:mysql://localhost:3306/invoice_analyzer?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: MySql@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  ssl:
    enabled: false

logging:
  level:
    root: INFO
    com.nazir.aiinvoice: DEBUG
ai:
  provider: ollama # Options: mock, local, openai, hybrid, ollama
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-3.5-turbo
  ollama:
    url: http://localhost:11434
    model: gemma3:4b # Using the available model on the system

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
